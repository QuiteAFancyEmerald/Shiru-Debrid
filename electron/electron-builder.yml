appId: com.github.rockinchaos.shiru
productName: Shiru
extraMetadata:
  # FORK PATCH: hardened debrid fork identity.
  _synopsis: &synopsis "Fork of Shiru for Linux; anime library manager for watching and tracking your collection in real time. Lightweight, powerful, private and fast. Features VPN interface lockdown and debrid support."
  _description: &description "A personal anime library manager for watching and tracking your collection in real time. Lightweight, powerful, and paws-itively fast. No waiting required!"
# FORK PATCH: publish feed targets QuiteAFancyEmerald/Shiru-Debrid so releases
# are published on GitHub. Update checks stay inert by default and only run
# when enabled in Settings → Fork.
publish:
  - provider: github
    owner: QuiteAFancyEmerald
    repo: Shiru-Debrid
# FORK PATCH: electron mirror kept from upstream for reproducible downloads.
electronDownload:
  mirror: https://packages.shiru.app/electron/
  customDir: "45.3.2"
protocols:
  name: shiru
  schemes:
    - shiru
    - magnet
# FORK PATCH: Linux x64 AppImage is the only supported target for this fork —
# Windows (nsis/portable), macOS (dmg/zip), deb and flatpak target configs
# were removed.
files:
  - build/**/*
  - "!node_modules/**/*.{mk,a,o,h}"
directories:
  buildResources: buildResources
asarUnpack: "**/*.node"
# FORK PATCH: the appimage "toolset" (1.0.3) packaged stale staging snapshots —
# dropping it makes electron-builder use the synchronous packager over the
# freshly-built linux-unpacked output.
linux:
  artifactName: ${os}-shiru-debrid-v${version}.${ext}
  icon: buildResources/icon.png
  category: AudioVideo;Video
  # FORK PATCH: the desktop Comment is sourced from `description`.
  description: "Fork of Shiru for Linux; anime library manager for watching and tracking your collection in real time. Lightweight, powerful, private and fast. Features VPN interface lockdown and debrid support."
  synopsis: *synopsis
  # FORK PATCH: attribution to the PR this fork is built from.
  maintainer: gabrieljcodes (PR #185, hardened local build) <maintainer@shiru.app>
  syncDesktopName: true
  desktop:
    entry:
      Comment: *synopsis
      Keywords: anime
      MimeType: x-scheme-handler/shiru;
  target:
    - arch: x64
      target: AppImage
