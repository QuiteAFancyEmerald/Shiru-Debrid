name: Build and Release

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_VERSION: '24.22.1'
  PNPM_VERSION: '12.17.0'

# FORK PATCH: prebuilt AppImages are published to GitHub Releases on this
# repository (not committed to the repo tree, not stored in LFS).

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.read_version.outputs.app_version }}
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6

      - name: Read Release Version
        id: read_version
        run: |
          VERSION=$(node -p "require('./electron/package.json').version")
          APP_VERSION="v$VERSION"
          echo "app_version=$APP_VERSION" >> $GITHUB_OUTPUT
          echo "App Version: $APP_VERSION"

      - name: Prepare GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APP_VERSION="${{ steps.read_version.outputs.app_version }}"
          PRERELEASE_FLAG=""
          if [[ "$APP_VERSION" == *"beta"* || "$APP_VERSION" == *"debrid"* ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          if ! gh release view "$APP_VERSION" > /dev/null 2>&1; then
            echo "Release $APP_VERSION not found, creating draft..."
            gh release create "$APP_VERSION" --draft $PRERELEASE_FLAG --title "${APP_VERSION#v} (Shiru-Debrid)" --notes "Debrid-only fork of Shiru, based on gabrieljcodes@feat/debrid-and-hayase-v2 (PR #185). Linux x64 AppImage; Mullvad exit-node enforced; updates frozen."
          else
            echo "Release $APP_VERSION already exists, skipping creation."
          fi

  release-linux:
    needs: prepare-release
    runs-on: ubuntu-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6

      - name: Setup PNPM
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: |
          cd electron
          pnpm install --frozen-lockfile

      - name: Build and Publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd electron
          pnpm run publish
